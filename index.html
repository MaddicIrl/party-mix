<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFC Random Playlist</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
        }
        #playButton {
            background-color: #1DB954; /* Clean green button */
            color: white;
            border: none;
            padding: 20px 40px;
            font-size: 24px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }
        #playButton:active {
            transform: scale(0.95);
        }
        #status {
            margin-top: 20px;
            font-size: 16px;
            color: #b3b3b3;
        }
    </style>
</head>
<body>

    <button id="playButton">🎵 Tap to Play Random Track</button>
    <div id="status">Loading track layout...</div>

    <!-- Hidden audio element -->
    <audio id="audioPlayer" controls style="display:none;"></audio>

    <script>
        // Paste your working Dropbox links here
        const playlist = [
 https://dl.dropboxusercontent.com/scl/fi/giyxz7frjci7tqge8t2zf/Ashley.mp4?rlkey=42cl74levfwd8937qh9h8cfo9&st=v5oahveu&raw=1,
            https://dl.dropboxusercontent.com/scl/fi/ev7nn4prynnpoftvdns41/Butter.mp3?rlkey=13qc1eg87cvnhfahcke6rmdna&raw=1,
https://dl.dropboxusercontent.com/scl/fi/s8wgj87ok6856icr1q1eh/Bolted-Down.mp3?rlkey=74ca98mkwmu71dk7k7lc6dhec&raw=1,
https://dl.dropboxusercontent.com/scl/fi/2ocmc5uohih06afe14d3n/Culture.mp3?rlkey=hdf88g7uuh352t0k1cf8rat8h&raw=1,
https://dl.dropboxusercontent.com/scl/fi/x54vlnbdwtjsw0kgadkxj/He-is-nothing-but.mp3?rlkey=t0lc271dg2em5zgm1odol0zyn&raw=1,
https://dl.dropboxusercontent.com/scl/fi/5f84uwj1aweulpem0q45z/Like-a-light.mp3?rlkey=79hw53bezqbxeiwd7vjt1yhge&raw=1,
https://dl.dropboxusercontent.com/scl/fi/ub5mkqdqtpz1leom2sn3x/Milk.mp3?rlkey=u93pwv9zzq51x0e91ihjcom2l&raw=1,
https://dl.dropboxusercontent.com/scl/fi/wrca4chlf75n3x9qmzv8b/Naughty?rlkey=qhalbedzpy9v3nx56xjfs0pnb&raw=1,
https://dl.dropboxusercontent.com/scl/fi/0ij7he2knt4xwrf8um6ow/Rodney?rlkey=navca568aujp6600vg70hsu0q&raw=1,
https://dl.dropboxusercontent.com/scl/fi/a0vhcr2xcprfec5s1jetz/Will-we-do.mp3?rlkey=yn7jb560uz01dubduocan5vdy&raw=1
        ];

        const playButton = document.getElementById('playButton');
        const statusDiv = document.getElementById('status');
        const player = document.getElementById('audioPlayer');

        // Select a random track immediately on page load
        const randomTrack = playlist[Math.floor(Math.random() * playlist.length)];
        player.src = randomTrack;
        statusDiv.innerText = "Track selected. Ready to play!";

        // Wait for user interaction to bypass browser block
        playButton.addEventListener('click', () => {
            statusDiv.innerText = "Streaming audio...";
            
            player.play()
                .then(() => {
                    statusDiv.innerText = "Playing random track!";
                    playButton.innerText = "🔊 Playing...";
                    playButton.style.backgroundColor = "#555";
                })
                .catch(error => {
                    console.error("Playback failed:", error);
                    statusDiv.innerText = "Error: Check your link formatting or network connection.";
                });
        }, { once: true }); // 'once: true' ensures the event listener fires cleanly
    </script>
</body>
</html>
