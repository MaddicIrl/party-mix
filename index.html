<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFC Random Playlist</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
        }
        #playButton {
            background-color: #1DB954; /* Clean green button */
            color: white;
            border: none;
            padding: 20px 40px;
            font-size: 24px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }
        #playButton:active {
            transform: scale(0.95);
        }
        #status {
            margin-top: 20px;
            font-size: 16px;
            color: #b3b3b3;
        }
    </style>
</head>
<body>

    <button id="playButton">🎵 Tap to Play Random Track</button>
    <div id="status">Loading track layout...</div>

    <!-- Hidden audio element -->
    <audio id="audioPlayer" controls style="display:none;"></audio>

    <script>
        // Paste your working Dropbox links here
        const playlist = [
Audio/ashley.mp4, audio/milk.mp3, audio/butter.mp3, audio/bolted down.mp3, audio/naughty.mp3, audio/culture.mp3, audio/he is nothing but.mp3, audio/Like a light.mp3,audio/rodney.mp3, audio/Poor Kerryman.mp3, audio/will we do.mp3];

        const playButton = document.getElementById('playButton');
        const statusDiv = document.getElementById('status');
        const player = document.getElementById('audioPlayer');

        // Select a random track immediately on page load
        const randomTrack = playlist[Math.floor(Math.random() * playlist.length)];
        player.src = randomTrack;
        statusDiv.innerText = "Track selected. Ready to play!";

        // Wait for user interaction to bypass browser block
        playButton.addEventListener('click', () => {
            statusDiv.innerText = "Streaming audio...";
            
            player.play()
                .then(() => {
                    statusDiv.innerText = "Playing random track!";
                    playButton.innerText = "🔊 Playing...";
                    playButton.style.backgroundColor = "#555";
                })
                .catch(error => {
                    console.error("Playback failed:", error);
                    statusDiv.innerText = "Error: Check your link formatting or network connection.";
                });
        }, { once: true }); // 'once: true' ensures the event listener fires cleanly
    </script>
</body>
</html>
