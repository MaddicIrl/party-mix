<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFC Random Playlist</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
        }
        #playButton {
            background-color: #1DB954;
            color: white;
            border: none;
            padding: 20px 40px;
            font-size: 24px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }
        #playButton:active {
            transform: scale(0.95);
        }
        #status {
            margin-top: 20px;
            font-size: 16px;
            color: #b3b3b3;
        }
    </style>
</head>
<body>

    <button id="playButton">🎵 Tap to Play Random Track</button>
    <div id="status">Loading track...</div>

    <audio id="audioPlayer" controls style="display:none;"></audio>

    <script>
        // Make sure your filenames exactly match your uploaded files (case-sensitive!)
        const playlist = [
            "audio/Ashley.mp3", 
            "audio/Milk.mp3", 
            "audio/Butter.mp3", 
            "audio/Bolted_Down.mp3", 
            "audio/Rooster.mp3", 
            "audio/Culture.mp3",
            "audio/He_is_nothing_but.mp3", 
            "audio/Like_a_light.mp3",
            "audio/Rodney.mp3",
            "audio/Poor_Kerryman.mp3",
            "audio/Will_we_do.mp3",
            "audio/Wombles.mp3"
        ];

        const playButton = document.getElementById('playButton');
        const statusDiv = document.getElementById('status');
        const player = document.getElementById('audioPlayer');

        // Pick a random track safely
        const randomTrack = playlist[Math.floor(Math.random() * playlist.length)];
        player.src = randomTrack;
        statusDiv.innerText = "Track ready to stream.";

        playButton.addEventListener('click', () => {
            statusDiv.innerText = "Playing audio...";
            
            player.play()
                .then(() => {
                    statusDiv.innerText = "Playing random track!";
                    playButton.innerText = "🔊 Playing...";
                    playButton.style.backgroundColor = "#555";
                })
                .catch(error => {
                    console.error("Playback failed:", error);
                    statusDiv.innerText = "Playback blocked. Check your audio files.";
                });
        }, { once: true });
    </script>
</body>
</html>
